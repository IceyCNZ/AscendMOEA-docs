version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.13"
  jobs:
    build:
      html:
        - mkdir -p "$READTHEDOCS_OUTPUT/html/"
        - >-
          find . -mindepth 1 -maxdepth 1
          ! -name .git
          ! -name .readthedocs.yaml
          ! -name _readthedocs
          -exec cp -a {} "$READTHEDOCS_OUTPUT/html/" \;
