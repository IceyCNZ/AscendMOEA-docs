{%- set is_en = pagename.startswith('en/') -%}
<div class="book-toolbar-switcher">
  <button class="book-toolbar-toggle book-language-button" type="button" aria-controls="book-language-options"
          aria-expanded="false" aria-label="{{ 'Switch language' if is_en else '切换语言' }}">
    <i class="fa-solid fa-globe" aria-hidden="true"></i>
  </button>
  <div class="book-toolbar-menu" id="book-language-options">
    <a href="{{ pathto('index') }}" data-language-link="zh" lang="zh-CN">中文</a>
    <a href="{{ pathto('en/index') }}" data-language-link="en" lang="en">English</a>
  </div>
</div>
