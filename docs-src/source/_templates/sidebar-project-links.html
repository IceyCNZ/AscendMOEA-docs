{%- set is_en = pagename.startswith('en/') -%}
<div class="book-sidebar-meta">
  <span class="book-status-dot" aria-hidden="true"></span>
  <strong>AscendMOEA {{ release }}</strong>
  <a href="https://github.com/dqlme/AscendMOEA/discussions">{{ 'Discussions' if is_en else '讨论区' }}</a>
  <a class="book-visits-link" href="{{ pathto('en/visits' if is_en else 'visits') }}"
     data-visit-sidebar data-visits-api="{{ visits_api | e }}">
    <i class="fa-solid fa-globe book-visits-icon" aria-hidden="true"></i>
    <span class="book-visits-sidebar-text">
      <span data-visit-region>{{ 'Visit statistics' if is_en else '访问统计' }}</span>
      <span data-visit-count hidden></span>
    </span>
    <i class="fa-solid fa-chevron-right book-visits-arrow" aria-hidden="true"></i>
  </a>
</div>
