{%- set is_en = pagename.startswith('en/') -%}
<div class="book-toolbar-switcher pst-js-only">
  <button class="book-toolbar-toggle book-theme-button" type="button" aria-controls="book-theme-options"
          aria-expanded="false" aria-label="{{ 'Color mode' if is_en else '颜色模式' }}">
    <i class="fa-solid fa-sun" data-mode="light" aria-hidden="true"></i>
    <i class="fa-solid fa-moon" data-mode="dark" aria-hidden="true"></i>
    <i class="fa-solid fa-circle-half-stroke" data-mode="auto" aria-hidden="true"></i>
  </button>
  <div class="book-toolbar-menu" id="book-theme-options">
    <button class="theme-change-button" type="button" data-mode="auto">{{ 'Auto' if is_en else '自动' }}</button>
    <button class="theme-change-button" type="button" data-mode="light">{{ 'Light' if is_en else '浅色' }}</button>
    <button class="theme-change-button" type="button" data-mode="dark">{{ 'Dark' if is_en else '深色' }}</button>
  </div>
</div>
